info:
  name: Create Student
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/student/create
  body:
    type: json
    data: |-
      {
        "age": 24,
        "email": "Sahil@aayush.com",
        "name": "Sahil Gurg",
        "rollNo": 33,
        "subject": "Power Systems"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a new student. Returns 201 Created with the created student.
