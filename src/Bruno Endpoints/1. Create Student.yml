info:
  name: Create Student
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/student
  body:
    type: json
    data: |-
      {
        "age": 20,
        "email": "Yash@aayush.com",
        "name": "Yash Mishra",
        "rollNo": 99,
        "subject": "UX"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create a new student. Returns 201 Created with the created student.
